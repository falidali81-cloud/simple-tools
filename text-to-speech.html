<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحويل النص إلى كلام - TextFix</title>
<meta name="description" content="أداة مجانية لتحويل النص إلى كلام بالعربية والفرنسية والإنجليزية.">

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #1c1f23;
  --muted: #5b6470;
  --border: #c9d0d8;
  --btn: #222;
  --btn-text: #fff;
  --accent: #0b6e4f;
}

:root[data-theme="dark"] {
  --bg: #14171a;
  --card: #1e2227;
  --text: #eceff3;
  --muted: #a3acb8;
  --border: #3a414a;
  --btn: #3b4450;
  --btn-text: #fff;
  --accent: #4cc99b;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Tahoma, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 640px;
  margin: auto;
  background: var(--card);
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

.top {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 10px;
}

h1 {
  margin: 5px 0 10px;
  font-size: 30px;
}

.sub {
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 18px;
}

textarea {
  width: 100%;
  min-height: 220px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 17px;
  font-family: inherit;
  background: var(--card);
  color: var(--text);
  resize: vertical;
  line-height: 1.7;
}

textarea:focus,
select:focus,
input:focus,
button:focus {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

label {
  display: block;
  text-align: right;
  margin: 16px 0 7px;
  color: var(--muted);
  font-weight: bold;
}

select,
input[type="range"] {
  width: 100%;
}

select {
  padding: 11px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
}

.speed-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.speed-row input {
  flex: 1;
}

#rateValue {
  min-width: 45px;
  font-weight: bold;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--btn);
  color: var(--btn-text);
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;
}

button.main {
  background: var(--accent);
}

button:active {
  transform: scale(.98);
}

.back {
  display: inline-block;
  margin-top: 20px;
  color: var(--accent);
  font-weight: bold;
  text-decoration: none;
}

#status {
  margin-top: 14px;
  color: var(--muted);
  min-height: 24px;
}

@media (max-width: 480px) {
  body {
    padding: 12px;
  }

  .container {
    padding: 18px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top">
    <button id="themeBtn" onclick="toggleTheme()">
      🌙 الوضع الليلي
    </button>
  </div>

  <h1>🔊 تحويل النص إلى كلام</h1>

  <p class="sub">
    اكتب أو الصق النص، اختر اللغة والصوت، ثم اضغط تشغيل.
  </p>

  <textarea
    id="text"
    placeholder="اكتب النص هنا..."
    aria-label="النص المراد تحويله إلى كلام"></textarea>

  <label for="voice">
    🎙️ الصوت
  </label>

  <select id="voice">
    <option value="">جارٍ تحميل الأصوات...</option>
  </select>

  <label for="rate">
    ⚡ سرعة الكلام
  </label>

  <div class="speed-row">
    <input
      id="rate"
      type="range"
      min="0.5"
      max="2"
      step="0.1"
      value="1"
    >

    <span id="rateValue">1.0×</span>
  </div>

  <div class="buttons">

    <button class="main" onclick="speakText()">
      ▶️ تشغيل
    </button>

    <button onclick="pauseSpeech()">
      ⏸️ إيقاف مؤقت
    </button>

    <button onclick="resumeSpeech()">
      ▶️ متابعة
    </button>

    <button onclick="stopSpeech()">
      ⏹️ إيقاف
    </button>

    <button onclick="clearText()">
      🗑️ مسح النص
    </button>

  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <a class="back" href="index.html">
    ← العودة إلى TextFix
  </a>

</div>

<script>

const synth = window.speechSynthesis;

const text = document.getElementById("text");
const voiceSelect = document.getElementById("voice");
const rate = document.getElementById("rate");
const rateValue = document.getElementById("rateValue");
const statusEl = document.getElementById("status");
const themeBtn = document.getElementById("themeBtn");

let voices = [];

/* ---------- الأصوات ---------- */

function loadVoices() {

  voices = synth.getVoices();

  voiceSelect.innerHTML = "";

  if (!voices.length) {

    const option = document.createElement("option");
    option.textContent = "لا توجد أصوات متاحة حاليًا";
    option.value = "";

    voiceSelect.appendChild(option);

    return;
  }

  /* ترتيب الأصوات حسب اللغة */

  const languageOrder = {
    "ar": 1,
    "fr": 2,
    "en": 3
  };

  voices.sort((a, b) => {

    const aLang = a.lang.toLowerCase().substring(0, 2);
    const bLang = b.lang.toLowerCase().substring(0, 2);

    return (languageOrder[aLang] || 99)
         - (languageOrder[bLang] || 99);

  });

  voices.forEach((voice, index) => {

    const option = document.createElement("option");

    option.value = index;

    option.textContent =
      `${getLanguageName(voice.lang)} — ${voice.name}`;

    voiceSelect.appendChild(option);

  });

  /* اختيار صوت عربي إن وجد */

  const arabicIndex = voices.findIndex(v =>
    v.lang.toLowerCase().startsWith("ar")
  );

  if (arabicIndex >= 0) {
    voiceSelect.value = arabicIndex;
  }
}

function getLanguageName(lang) {

  const code = lang.toLowerCase().substring(0, 2);

  if (code === "ar") return "🇸🇦 العربية";
  if (code === "fr") return "🇫🇷 الفرنسية";
  if (code === "en") return "🇬🇧 الإنجليزية";

  return lang;
}

loadVoices();

if ("onvoiceschanged" in synth) {
  synth.onvoiceschanged = loadVoices;
}

/* ---------- التشغيل ---------- */

function speakText() {

  const value = text.value.trim();

  if (!value) {

    statusEl.textContent =
      "⚠️ اكتب نصًا أولًا.";

    return;
  }

  synth.cancel();

  const utterance =
    new SpeechSynthesisUtterance(value);

  const selectedIndex =
    Number(voiceSelect.value);

  if (voices[selectedIndex]) {
    utterance.voice = voices[selectedIndex];
    utterance.lang = voices[selectedIndex].lang;
  }

  utterance.rate = Number(rate.value);
  utterance.pitch = 1;

  utterance.onstart = () => {
    statusEl.textContent = "🔊 يتم تشغيل النص...";
  };

  utterance.onend = () => {
    statusEl.textContent = "✅ انتهى تشغيل النص.";
  };

  utterance.onerror = () => {
    statusEl.textContent =
      "❌ حدث خطأ أثناء تشغيل النص.";
  };

  synth.speak(utterance);
}

function pauseSpeech() {

  if (synth.speaking) {

    synth.pause();

    statusEl.textContent =
      "⏸️ تم إيقاف الكلام مؤقتًا.";
  }
}

function resumeSpeech() {

  if (synth.paused) {

    synth.resume();

    statusEl.textContent =
      "▶️ تمت متابعة الكلام.";
  }
}

function stopSpeech() {

  synth.cancel();

  statusEl.textContent =
    "⏹️ تم إيقاف الكلام.";
}

/* ---------- السرعة ---------- */

rate.addEventListener("input", () => {

  rateValue.textContent =
    Number(rate.value).toFixed(1) + "×";

});

/* ---------- مسح ---------- */

function clearText() {

  stopSpeech();

  text.value = "";

  statusEl.textContent =
    "تم مسح النص.";
}

/* ---------- الوضع الليلي ---------- */

function applyTheme(theme) {

  document.documentElement
    .setAttribute("data-theme", theme);

  themeBtn.textContent =
    theme === "dark"
      ? "☀️ الوضع النهاري"
      : "🌙 الوضع الليلي";
}

function toggleTheme() {

  const current =
    document.documentElement
      .getAttribute("data-theme");

  const next =
    current === "dark"
      ? "light"
      : "dark";

  applyTheme(next);

  try {
    localStorage.setItem(
      "textfixTheme",
      next
    );
  } catch (e) {}

}

try {

  const savedTheme =
    localStorage.getItem("textfixTheme");

  applyTheme(
    savedTheme ||
    (
      window.matchMedia &&
      matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light"
    )
  );

} catch (e) {

  applyTheme("light");

}

</script>

</body>
</html>
